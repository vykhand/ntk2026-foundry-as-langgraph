# The FULL eval recipe (cached run, not for the stage clock): code metrics + LLM judges.
# smoke-core is the rubric evaluator `azd ai agent eval generate` produced from the agent
# description (evaluators/smoke-core/rubric_dimensions.json); ntk_completeness / ntk_language are
# our registered prompt-based judges (scripts/build_evaluators.py).
name: ntk-full
agent:
    name: ntk-asistent
    kind: hosted
# local_uri paths are relative to the agent project directory (the repo root), not to this file.
dataset:
    local_uri: evals/golden.jsonl
evaluators:
    - ntk_clash_free
    - ntk_preferences
    - ntk_break_coverage
    - ntk_completeness
    - ntk_language
    - name: smoke-core
      version: "1"
      local_uri: evaluators/smoke-core/rubric_dimensions.json
options:
    eval_model: gpt-5.4-mini
max_samples: 15
