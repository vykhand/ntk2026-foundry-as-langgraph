[project]
name = "ntk-asistent"
version = "0.1.0"
description = "NTK asistent — a plain LangGraph agent hosted on Foundry Agent Service (NTK 2026, Talk 2 demo)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Hosting adapter (the only Foundry-specific runtime dependency; used in src/hosting only)
    "langchain-azure-ai[hosting]==1.2.9",
    # The [hosting] extra's lower bounds are pre-release specifiers, so resolvers pick 2.2.0b1/2.1.0b2;
    # stable releases exist (2026-08-26) and the official samples pin them — do the same.
    "azure-ai-agentserver-core==2.1.0",
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-agentserver-invocations==1.1.0",
    # LangGraph / LangChain core — what src/agent actually uses
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    # Foundry model access (src/hosting/llm.py) — azure-ai-projects imports httpx directly; OpenAI 3 needs httpx 2
    "azure-ai-projects>=2.4.0",
    "azure-identity",
    "openai<3",
    "httpx<1",
    "python-dotenv",
]

[project.scripts]
# One command per act (handover constraint #6). Act 2–4 runners land in later phases.
act1 = "scripts.act1:main"
act3 = "scripts.act3:main"
invoke = "scripts.invoke:main"
rollback = "scripts.rollback:main"
gen-program = "scripts.gen_program:main"
fetch-program = "scripts.fetch_program:main"
build-evaluators = "scripts.build_evaluators:main"
eval-local = "scripts.eval_local:main"
eval-cloud = "scripts.eval_cloud:main"
bot = "scripts.telegram_bot:main"
az-login = "scripts.az_login:main"
warm-cache = "scripts.warm_cache:main"

[dependency-groups]
demo = [
    "marimo>=0.24.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "jsonschema>=4.23",
    # debugpy enables the Foundry Toolkit F5 flow in VS Code (attach on :5679)
    "debugpy",
    # Act 3 terminal fallback: query the connected Application Insights workspace (uv run act3 --kql)
    "azure-monitor-query>=1.4",
    "python-pptx>=1.0.2",
    "segno>=1.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/hosting", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "tests"]
# Claude Code worktrees live under .claude/worktrees inside the repo; they are not our sources.
# evals/evaluators/*.py are generated by scripts/build_evaluators.py (one 35 KB line of program JSON).
extend-exclude = [".claude", "evals/evaluators"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Hand-written SVG markup and KQL strings read better unwrapped.
"scripts/eval_chart.py" = ["E501"]
"scripts/act3.py" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

# The notebooks are a stage surface: opening one must show a running notebook, not a wall of stale
# cells waiting to be clicked. marimo's defaults on this laptop left every cell unrun, which is
# also what made the first pass of `scripts/record_notebooks.py` record four notebooks that had
# never executed. Project config, so the speaker's laptop and the recorder agree.
[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"

# Opening a notebook must not rewrite it. marimo normalises a file it saves: it strips the section
# comments between cells and drops a cell parameter the body never names — and one of those
# parameters is load-bearing here (`notebooks/README.md`: a cell that imports from `agent`,
# `hosting` or `scripts` takes `ntk` so marimo knows the sys.path setup has to run first). One
# recording run was enough to lose both from 01_graph.py. The notebooks are a stage surface and a
# reviewed artefact; they change through a commit, not through opening them.
[tool.marimo.save]
autosave = "off"
format_on_save = false
